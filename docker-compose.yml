services:
  addon:
    build: .
    image: tghub-stremio-addon
    container_name: tghub-stremio-addon
    restart: unless-stopped
    ports:
      - "7000:7000"
    environment:
      PORT: 7000
      HOST: 0.0.0.0
      # Only needed if you want Stremio to reach the addon from another device.
      # Set this to your tunnel / public https origin so generated URLs are correct.
      # PUBLIC_ORIGIN: https://your-tunnel.example.com
      # Optional fallback if Cinemeta is blocked on your network.
      # TMDB_API_KEY: your_tmdb_read_access_token

  # Optional: expose the addon over https so phones / Android TV / Stremio Web
  # can reach it. Enable with:  docker compose --profile tunnel up -d
  # The generated https URL is printed in the logs:
  #   docker compose logs -f tunnel
  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    container_name: tghub-tunnel
    restart: unless-stopped
    depends_on:
      - addon
    command: tunnel --no-autoupdate --url http://addon:7000
